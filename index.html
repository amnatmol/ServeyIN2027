<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ดัชนีความน่าเชื่อถือด้านแรงงาน จังหวัดอำนาจเจริญ</title>
  
  <link rel="manifest" href="./manifest.json">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#5B21B6">
  <meta name="apple-mobile-web-app-title" content="ดัชนีความน่าเชื่อถือด้านแรงงาน">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #5B21B6;
    }
    iframe {
      border: none; width: 100%; height: 100%;
    }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbxKuogtFL2CaPcwaB70MrKiCUUgJh0atb-OpOVBYw7atAHkA2jg0MkKUW4G6SnWTJhi/exec"></iframe>

 <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker สำเร็จ!'))
        .catch(err => console.log('Service Worker ล้มเหลว:', err));
    });
  }

  // ดักจับอีเวนต์เพื่อเปิดให้ติดตั้ง PWA
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('พร้อมสำหรับการติดตั้ง PWA');
  });
</script>
</body>
</html>
